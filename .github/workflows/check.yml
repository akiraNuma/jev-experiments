name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit
      - name: Recalculate saved results without API keys or source datasets
        run: |
          node --import tsx scripts/classify-report.ts
          python3 scripts/recipe-report.py
          python3 scripts/recipe-cascade.py
          python3 scripts/test-image-report.py
          python3 scripts/recipe-images-report.py
          python3 scripts/report-so101.py
          git diff --exit-code -- experiments/recipes/pets/report.json experiments/recipes/so101/report.json
